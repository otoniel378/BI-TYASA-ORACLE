name: Keep Alive - App Streamlit

on:
  schedule:
    # Cada 30 minutos, todos los días — evita que Streamlit Community Cloud
    # ponga la app en reposo por inactividad.
    - cron: "*/30 * * * *"
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Hacer ping a la app para mantenerla despierta
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 60 \
            "https://bi-tyasa-oracle-fhqbxdqztfkrpbpbunmfjz.streamlit.app/"
