name: Actualización Diaria de Sentimiento de Noticias

on:
  # El cron nativo de GitHub Actions se quitó a propósito: llega puntualmente
  # 4-7 horas tarde en cuentas gratuitas (patrón confirmado durante semanas),
  # y haberlo dejado como "respaldo" junto al disparador externo preciso
  # (cron-job.org -> workflow_dispatch) causó corridas casi simultáneas que
  # saturaron el rate limit de Gemini el 14-oct-2026. El horario real ahora
  # vive en cron-job.org: 9:00 AM y 3:00 PM México, lunes a viernes.
  workflow_dispatch:  # permite correrlo manualmente desde GitHub, y es lo que usa cron-job.org

jobs:
  update-sentimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Caché de modelo de embeddings (HuggingFace)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-minilm-v1

      - name: Instalar dependencias
        # scikit-learn + sentence-transformers (clasificador local de categoría,
        # ver ml/categoria_noticias/inferencia.py) — sentence-transformers trae
        # torch como dependencia, por eso el timeout y la caché de arriba.
        # googlenewsdecoder (+ selectolax<1.0, pin por compatibilidad) resuelve
        # las URLs de Google News RSS a la URL real del artículo para el correo.
        run: |
          pip install oracledb pandas python-dotenv requests scikit-learn sentence-transformers
          pip install googlenewsdecoder "selectolax<1.0"
          pip install google-genai

      - name: Extraer wallet de Oracle
        run: |
          mkdir -p /tmp/oracle_wallet
          echo "${{ secrets.ORACLE_WALLET_B64 }}" | base64 -d > /tmp/oracle_wallet.zip
          unzip -o /tmp/oracle_wallet.zip -d /tmp/oracle_wallet
          echo "Wallet extraído:"
          ls /tmp/oracle_wallet

      - name: Clasificar y guardar sentimiento de noticias en Oracle ADW
        env:
          ORACLE_USER:            ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD:        ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_DSN:             ${{ secrets.ORACLE_DSN }}
          ORACLE_WALLET_DIR:      /tmp/oracle_wallet
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER:             ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:     ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO:        ${{ secrets.DIGEST_EMAIL_TO }}
        run: python scripts/update_sentimiento_noticias.py

      - name: Cruzar quiebres activos con noticias clasificadas
        env:
          ORACLE_USER:            ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD:        ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_DSN:             ${{ secrets.ORACLE_DSN }}
          ORACLE_WALLET_DIR:      /tmp/oracle_wallet
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
        run: python scripts/link_noticias_quiebres.py

      - name: Capturar eventos significativos automáticamente
        env:
          ORACLE_USER:            ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD:        ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_DSN:             ${{ secrets.ORACLE_DSN }}
          ORACLE_WALLET_DIR:      /tmp/oracle_wallet
          ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/capturar_eventos_automaticos.py

      - name: Resultado
        if: always()
        run: echo "Actualización completada - $(date)"
