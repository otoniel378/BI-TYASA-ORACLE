name: Test - Notificación de falla (temporal)

on:
  workflow_dispatch:  # solo se corre manualmente, nunca por cron

jobs:
  test-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Forzar una falla (a propósito, solo para probar el aviso)
        run: exit 1

      - name: Avisar por correo si falló
        if: failure()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO:    ${{ secrets.DIGEST_EMAIL_TO }}
        run: python scripts/notify_failure.py
